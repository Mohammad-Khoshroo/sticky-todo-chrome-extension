<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>TODO</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/stick-note.ico?v=0" type="image/x-icon">
    <link href="vazirmatn/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <script src="jalaali/dist/jalaali.min.js"></script>
    <script src="./js/masorny.js"></script>
    <script src="js/i18n.js"></script>
    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('theme');
                const isDark = savedTheme === 'dark' || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (isDark) {
                    document.documentElement.classList.add('dark-mode');
                }
                const savedLang = localStorage.getItem('appLanguage') || 'fa';
                const isRtl = (savedLang === 'fa' || savedLang === 'ar');
                document.documentElement.setAttribute('dir', isRtl ? 'rtl' : 'ltr');
                document.documentElement.setAttribute('lang', savedLang);
            } catch (e) {}
        })();
    </script>
</head>

<body class="no-calendar-transition">

    <!-- CALENDAR -->
    <div id="calendar-wrapper" class="calendar-wrapper">

        <div class="Calendar" id="calendar">
            <div class="calendar-top-bar">
                <button id="calendar-type-btn" class="calendar-type-btn" type="button" title="تغییر نوع تقویم (شمسی / میلادی)">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <defs>
                        <filter id="calShadow" x="-20%" y="-20%" width="140%" height="140%">
                          <feDropShadow dx="0" dy="1.2" stdDeviation="0.8" flood-opacity="0.35"/>
                        </filter>
                      </defs>
                      <!-- Globe in background -->
                      <circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.5"/>
                      <path d="M3 10C3 10 5.8 13.5 10 13.5C14.2 13.5 17 10 17 10" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
                      <path d="M3 10C3 10 5.8 6.5 10 6.5C14.2 6.5 17 10 17 10" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
                      <ellipse cx="10" cy="10" rx="3.2" ry="7.5" stroke="currentColor" stroke-width="1.1"/>
                      <!-- Calendar sheet in foreground -->
                      <g filter="url(#calShadow)">
                        <rect x="9" y="8" width="12.5" height="13" rx="2.2" fill="#ffffff" stroke="#334155" stroke-width="1.1"/>
                        <path d="M9 10.2C9 9 9.9 8 11.2 8H19.3C20.5 8 21.5 9 21.5 10.2V12H9V10.2Z" fill="#6366f1"/>
                        <rect x="11.5" y="6.8" width="1.4" height="2.5" rx="0.7" fill="#e2e8f0" stroke="#334155" stroke-width="0.8"/>
                        <rect x="17.5" y="6.8" width="1.4" height="2.5" rx="0.7" fill="#e2e8f0" stroke="#334155" stroke-width="0.8"/>
                        <circle cx="12" cy="14.5" r="0.8" fill="#94a3b8"/>
                        <circle cx="15.2" cy="14.5" r="0.8" fill="#94a3b8"/>
                        <circle cx="18.5" cy="14.5" r="0.8" fill="#94a3b8"/>
                        <circle cx="12" cy="17.5" r="0.8" fill="#94a3b8"/>
                        <circle cx="15.2" cy="17.5" r="0.9" fill="#ef4444"/>
                        <circle cx="18.5" cy="17.5" r="0.8" fill="#94a3b8"/>
                      </g>
                    </svg>
                    <span id="calendar-type-badge" class="calendar-type-badge">شمسی</span>
                </button>
                <button class="toggleCalendarBtn" id="calendar-btn">− بستن تقویم</button>
            </div>
            <div class="header">
                <button id="prevBtn" type="button" title="ماه قبل">❮</button>
                <div id="monthYear"></div>
                <button id="nextBtn" type="button" title="ماه بعد">❯</button>
            </div>
            <div class="weekdays">
                <div>ش</div>
                <div>ی</div>
                <div>د</div>
                <div>س</div>
                <div>چ</div>
                <div>پ</div>
                <div>ج</div>
            </div>
            <div class="days" id="daysContainer"></div>
        </div>
        <div id="deadline-panel" class="deadline-panel">
            <div class="deadline-panel-header">
                <div id="deadline-panel-title" class="deadline-panel-title">ددلاین‌های امروز</div>
                <button type="button" id="deadline-panel-toggle-btn" class="deadline-panel-toggle-btn hidden" title="تغییر اندازه پنجره">− کوچک کردن</button>
            </div>
            <div id="deadline-list" class="deadline-list"></div>
        </div>
    </div>


    <!-- UI -->
    <div id="trash-bin" title="سطل بازیافت (مشاهده یادداشت‌های مچاله شده)">
        <img id="trash" src="images/trash-bin.ico" alt="trash-bin" width="70" height="70">
        <span id="trash-count-badge" class="trash-badge hidden">0</span>
    </div>

    <div id="eraser" draggable="true" title="برای حذف تسک، پاک‌کن را روی آن بکشید">
        <img src="images/eraser.ico" alt="eraser" width="45" height="45">
    </div>

    <div id="pen" class="pen" draggable="true" title="برای خط‌زدن تسک، مداد را روی آن بکشید">
        <img src="images/pencil.ico" alt="pen" width="45" height="45">
    </div>

    <div class="bottom-actions">
        <div class="lang-selector-wrapper" id="lang-selector-wrapper">
            <button id="lang-toggle-btn" class="lang-toggle-btn" type="button" title="تغییر زبان (Change Language)">
                <svg class="lang-icon" viewBox="0 0 24 24" width="26" height="26" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
                    <ellipse cx="12" cy="12" rx="4.2" ry="9" stroke="currentColor" stroke-width="1.2"/>
                    <line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="1.2"/>
                    <path d="M4.5 7.5C7 9.5 17 9.5 19.5 7.5" stroke="currentColor" stroke-width="1.2"/>
                    <path d="M4.5 16.5C7 14.5 17 14.5 19.5 16.5" stroke="currentColor" stroke-width="1.2"/>
                </svg>
                <span id="lang-current-flag" class="lang-current-flag">🇮🇷</span>
            </button>
            <div id="lang-dropdown" class="lang-dropdown hidden">
                <button type="button" class="lang-option" data-lang="fa">
                    <span class="lang-flag">🇮🇷</span>
                    <span class="lang-name">فارسی</span>
                </button>
                <button type="button" class="lang-option" data-lang="en">
                    <span class="lang-flag">🇬🇧</span>
                    <span class="lang-name">English</span>
                </button>
                <button type="button" class="lang-option" data-lang="ko">
                    <span class="lang-flag">🇰🇷</span>
                    <span class="lang-name">한국어</span>
                </button>
                <button type="button" class="lang-option" data-lang="ar">
                    <span class="lang-flag">🇸🇦</span>
                    <span class="lang-name">العربية</span>
                </button>
            </div>
        </div>
        <button id="theme-toggle-btn" class="theme-toggle-btn" type="button" title="تغییر حالت شب و روز (روشن / تاریک)">
            <svg class="theme-icon" viewBox="0 0 24 24" width="28" height="28" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#fbbf24" />
                  <stop offset="100%" stop-color="#f59e0b" />
                </linearGradient>
                <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#38bdf8" />
                  <stop offset="100%" stop-color="#818cf8" />
                </linearGradient>
              </defs>
              <!-- Sun Rays (left side) -->
              <path d="M12 2V4" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round"/>
              <path d="M4 12H2" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round"/>
              <path d="M6.34 6.34L4.93 4.93" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round"/>
              <path d="M6.34 17.66L4.93 19.07" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round"/>
              <path d="M12 22V20" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round"/>
              
              <!-- Left Half: Sun disc -->
              <path d="M12 4C7.58 4 4 7.58 4 12C4 16.42 7.58 20 12 20V4Z" fill="url(#sunGrad)"/>
              
              <!-- Right Half: Crescent Moon -->
              <path d="M12 4C16.42 4 20 7.58 20 12C20 16.42 16.42 20 12 20C15.2 17.6 16.8 14.9 16.8 12C16.8 9.1 15.2 6.4 12 4Z" fill="url(#moonGrad)"/>
              <path d="M12 4C15.2 6.4 16.8 9.1 16.8 12C16.8 14.9 15.2 17.6 12 20" stroke="#e0e7ff" stroke-width="1.2" stroke-linecap="round"/>
              
              <!-- Stars in the night sky (right side) -->
              <circle cx="18.5" cy="6.5" r="1" fill="#f8fafc"/>
              <path d="M19 12L19.4 12.8L20.2 13.2L19.4 13.6L19 14.4L18.6 13.6L17.8 13.2L18.6 12.8L19 12Z" fill="#f8fafc"/>
              <circle cx="17.5" cy="17.5" r="0.9" fill="#f8fafc"/>
            </svg>
        </button>
        <button id="add-note-btn">یادداشت جدید +</button>
    </div>

    <div id="container"></div>
    <!-- END UI -->

    <div id="task-context-menu" class="task-context-menu hidden">
        <button type="button" data-action="edit">ویرایش</button>
        <button type="button" data-action="toggle-scribble">خط‌زدن / بازگردانی</button>
        <button type="button" data-action="delete">حذف</button>
        <button type="button" data-action="set-deadline">تنظیم تاریخ</button>
        <button type="button" data-action="clear-deadline">حذف تاریخ</button>
    </div>

    <div id="note-context-menu" class="task-context-menu hidden">
        <button type="button" data-action="detach-note" id="ctx-detach-note-btn" class="hidden">⎘ خارج کردن از
            دسته</button>
        <button type="button" data-action="dissolve-stack" id="ctx-dissolve-stack-btn" class="hidden">📂 انحلال
            دسته</button>
        <button type="button" data-action="delete-note">🗑️ حذف</button>
    </div>
 
    <!-- TRASH MODAL -->
    <div id="trash-modal" class="trash-modal hidden">
        <div class="trash-modal-backdrop" id="trash-modal-backdrop"></div>
        <div class="trash-modal-content">
            <div class="trash-modal-header">
                <div class="trash-header-info">
                    <h2>🗑️ سطل زباله</h2>
                    <span class="trash-header-sub">یادداشت‌های مچاله شده تا ۲۴ ساعت در اینجا نگهداری می‌شوند</span>
                </div>
                <div class="trash-header-actions">
                    <button id="empty-trash-btn" class="empty-trash-btn" type="button">خالی کردن سطل</button>
                    <button id="close-trash-modal" class="close-trash-modal" type="button" title="بستن">✕</button>
                </div>
            </div>
            <div id="trash-modal-list" class="trash-modal-list"></div>
        </div>
    </div>

    <!-- <script src="script.js"></script> -->

    <script src="js/main.js"></script>
    <script src="js/calendar/calendar.js"></script>
    <script src="js/UI/trash-bin.js"></script>
    <script src="js/UI/pencil.js"></script>
    <script src="js/UI/eraser.js"></script>
    <script src="js/UI/window-controls.js"></script>
    <script src="js/UI/context-menu.js"></script>
    <script src="js/UI/theme.js"></script>
    <script src="js/UI/language.js"></script>
    <script src="js/note/note.js"></script>
    <script src="js/note/task.js"></script>

</body>

</html>
